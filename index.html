<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ekosistem Kesehatan 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one full-window 3D stage. Title, toolbar and queue panel float on top; details appear in a tooltip when a name tag or object is clicked. */
:root {
  --bg: #f1f6f7;
  --ink: #10222b;
  --muted: #566b73;
  --line: #c7d6d9;
  --panel: #fbfdfd;
  --c-obat: #0d9c8b;
  --c-pasien: #3566d6;
  --c-bpjs: #d97a1c;
  --c-pus: #1a8f50;
  --c-kli: #2368c4;
  --c-rs: #d0353c;
  --pus-wall: #2fa866;
  --pus-roof: #176b40;
  --kli-wall: #f3f7fc;
  --kli-roof: #2368c4;
  --rs-wall: #e9eff3;
  --rs-roof: #b9c6ce;
  --bpjs-wall: #eaf2f8;
  --bpjs-roof: #0f6cb6;
  --bpjs-green: #3aa655;
  --gudang-wall: #e7ece6;
  --gudang-roof: #0b7f71;
  --trim: #f7fafb;
  --paving: #d9d6cc;
  --ojol: #1fa84a;
  --car-glass: #2c4152;
  --lamp: #f4efd8;
  --leaf: #3f8f4f;
  --trunk: #6f5238;
  --skin: #d9a77c;
  --shirt-a: #e2725b;
  --shirt-b: #e3b23c;
  --shirt-c: #8a63d2;
  --pants: #2f3b52;
  --amb-stripe: #e8590c;
  --sky-top: #b6dbf0;
  --sky-bottom: #e8f4ec;
  --ground: #a8cf8d;
  --road: #56626b;
  --wall: #dbe4e7;
  --roof: #c3ced3;
  --glass: #5f93bd;
  --house: #e7edff;
  --tire: #20282c;
  --cross: #e5484d;
  --sun: 1;
  --btn-bg: #10222b;
  --btn-ink: #f1f6f7;
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1820; --ink: #e5f0f2; --muted: #92a8ae; --line: #26414b; --panel: #12252e;
    --c-obat: #35d6c0; --c-pasien: #7aa0ff; --c-bpjs: #ffa648; --c-pus: #4fd08a; --c-kli: #7aa9ff; --c-rs: #ff7b80;
    --sky-top: #0c1830; --sky-bottom: #2b4260;
    --ground: #3f5f3d; --road: #1a242b; --wall: #8ea0aa; --roof: #4a5a63; --glass: #2f5d80; --house: #5b6f9e;
    --lamp: #ffd98a; --sun: 0.8; --btn-bg: #e5f0f2; --btn-ink: #0b1820;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1820; --ink: #e5f0f2; --muted: #92a8ae; --line: #26414b; --panel: #12252e;
  --c-obat: #35d6c0; --c-pasien: #7aa0ff; --c-bpjs: #ffa648; --c-pus: #4fd08a; --c-kli: #7aa9ff; --c-rs: #ff7b80;
  --sky-top: #0c1830; --sky-bottom: #2b4260;
  --ground: #3f5f3d; --road: #1a242b; --wall: #8ea0aa; --roof: #4a5a63; --glass: #2f5d80; --house: #5b6f9e;
  --lamp: #ffd98a; --sun: 0.8; --btn-bg: #e5f0f2; --btn-ink: #0b1820;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.5;
}
h1 { margin: 0; font-size: 1.15rem; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; pointer-events: auto; }

.stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }

.top {
  position: absolute;
  z-index: 2;
  top: max(12px, env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  pointer-events: none;
}
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; align-self: stretch; }
.toolbar > * { pointer-events: auto; }
.chip, .btn {
  font: inherit; font-weight: 700; font-size: 0.84rem; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px; min-height: 36px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--c); }
.chip[aria-pressed="false"] { color: var(--muted); }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.chip:hover, .btn:hover { border-color: var(--muted); }
.btn { border-radius: 10px; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.speed { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: var(--ink); font-size: 0.84rem; font-weight: 700; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; min-height: 36px; }
.speed input { width: 110px; accent-color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.tags { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  font: inherit; font-size: 0.78rem; font-weight: 800; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px 3px 8px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  will-change: transform;
}
.tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.tag.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.tag[hidden] { display: none; }
.hint { position: absolute; z-index: 1; left: 12px; bottom: 12px; margin: 0; font-size: 0.78rem; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; pointer-events: none; }
.nogl { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.hud { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 0.78rem; line-height: 1.35; display: grid; grid-template-columns: auto auto auto; gap: 3px 10px; align-items: center; }
.hud .eyebrow { grid-column: 1 / -1; font-size: 0.66rem; }
.hud b { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; }
.hud b i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: inline-block; }
.hud strong { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.hud span.w { color: var(--muted); font-variant-numeric: tabular-nums; }

.tip {
  position: absolute; z-index: 3; left: 0; top: 0;
  width: 330px; max-height: calc(100% - 24px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 10px 30px rgba(5, 20, 30, 0.28);
  will-change: transform;
}
.tip h2 { margin: 0; padding-right: 32px; font-size: 1.02rem; line-height: 1.25; font-weight: 800; }
.tip p { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
.tip-close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; font: inherit; font-size: 1.1rem; line-height: 1; color: var(--muted); background: transparent; border: 0; border-radius: 8px; cursor: pointer; }
.tip-close:hover { color: var(--ink); background: var(--bg); }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.badge { align-self: flex-start; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--muted); border-radius: 6px; padding: 1px 7px; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 2px 0 0; padding: 0; }
.metrics div { min-width: 0; }
.metrics dt { font-size: 0.74rem; color: var(--muted); line-height: 1.25; }
.metrics dd { margin: 1px 0 0; font-family: var(--font-mono); font-size: 1.05rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.services { display: flex; flex-wrap: wrap; gap: 5px 6px; }
.svc { display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; font-weight: 700; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 3px; }
.svc img { width: 22px; height: 22px; display: block; }
.tip p.live { color: var(--ink); font-weight: 700; }
.tip p.live strong { font-family: var(--font-mono); font-weight: 500; }

@media (max-width: 720px) {
  h1 { font-size: 0.95rem; padding: 4px 10px; }
  .toolbar { gap: 5px; }
  .chip, .btn { font-size: 0.72rem; padding: 3px 8px; min-height: 32px; gap: 5px; }
  .speed { margin-left: 0; font-size: 0.72rem; min-height: 32px; padding: 0 8px; }
  .speed input { width: 64px; }
  .hud { padding: 5px 9px; font-size: 0.7rem; }
  .hint { display: none; }
  .tip { left: 10px; right: 10px; top: auto; bottom: 10px; width: auto; max-height: 56%; transform: none !important; }
}
</style>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Maket 3D kawasan layanan kesehatan" role="img"></canvas>
  <div class="tags" id="tags"></div>
  <div class="top" id="top">
    <h1>Ekosistem Kesehatan 3D</h1>
    <div class="toolbar" id="toolbar" role="group" aria-label="Lapisan dan tampilan">
      <button class="btn" id="reset" type="button">Tampilan utuh</button>
      <button class="btn" id="theme" type="button"></button>
      <label class="speed" for="speed">Kecepatan
        <input id="speed" type="range" min="0.2" max="2" step="0.05" value="0.6">
      </label>
    </div>
    <div class="hud" id="hud"><span class="eyebrow">Antrian (simulasi)</span></div>
  </div>
  <p class="hint" id="hint">Geser untuk memutar. Gulir atau cubit untuk zoom. Klik nama atau bangunan untuk melihat info.</p>
  <section class="tip" id="tip" role="dialog" aria-labelledby="nName" hidden>
    <button class="tip-close" id="tipClose" type="button" aria-label="Tutup info">&times;</button>
    <span class="eyebrow">Info</span>
    <h2 id="nName"></h2>
    <p id="nDesc"></p>
    <div class="services" id="nServices"></div>
    <p class="live" id="nLive" hidden></p>
    <dl class="metrics" id="nMetrics"></dl>
    <span class="badge">Data contoh</span>
  </section>
  <div class="nogl" id="nogl" hidden>Peramban ini tidak bisa menampilkan grafis 3D (WebGL).</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('c');
  var tagsEl = document.getElementById('tags');

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (e) {
    canvas.hidden = true; tagsEl.hidden = true;
    document.getElementById('nogl').hidden = false;

  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  var allMats = [];
  function std(token) {
    var m = new THREE.MeshStandardMaterial({ color: css(token) || '#888', roughness: 0.85, metalness: 0 });
    m.userData.token = token; allMats.push(m); return m;
  }
  function basic(token, extra) {
    var o = { color: css(token) || '#888' };
    for (var k in (extra || {})) o[k] = extra[k];
    var m = new THREE.MeshBasicMaterial(o);
    m.userData.token = token; allMats.push(m); return m;
  }
  var line = new THREE.LineBasicMaterial({ color: css('--c-bpjs') || '#d97a1c', transparent: true, opacity: 0.6 });
  line.userData.token = '--c-bpjs'; allMats.push(line);

  var M = {
    ground: std('--ground'), road: std('--road'), wall: std('--wall'), roof: std('--roof'), glass: std('--glass'),
    house: std('--house'), tire: std('--tire'), cross: std('--cross'),
    obat: std('--c-obat'), pasien: std('--c-pasien'),
    pusWall: std('--pus-wall'), pusRoof: std('--pus-roof'), kliWall: std('--kli-wall'), kliRoof: std('--kli-roof'),
    rsWall: std('--rs-wall'), rsRoof: std('--rs-roof'), bpjsWall: std('--bpjs-wall'), bpjsRoof: std('--bpjs-roof'), bpjsGreen: std('--bpjs-green'),
    gudangWall: std('--gudang-wall'), gudangRoof: std('--gudang-roof'),
    lamp: basic('--lamp'), trim: std('--trim'), paving: std('--paving'), leaf: std('--leaf'), trunk: std('--trunk'), skin: std('--skin'),
    carGlass: std('--car-glass'), ojol: std('--ojol'), shirtA: std('--shirt-a'), shirtB: std('--shirt-b'), shirtC: std('--shirt-c'), pants: std('--pants'), ambStripe: std('--amb-stripe'),
    pulse: basic('--c-bpjs')

  var hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.7);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 0.62);
  sun.position.set(26, 40, 44);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  var sc = sun.shadow.camera;
  sc.left = -50; sc.right = 50; sc.top = 50; sc.bottom = -50; sc.near = 1; sc.far = 150;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  function applyTheme() {
    allMats.forEach(function (m) { m.color.set(css(m.userData.token)); });
    var k = parseFloat(css('--sun')) || 1;
    hemi.intensity = 0.7 * k;
    hemi.color.set(k < 1 ? '#9db6e0' : '#ffffff');
    hemi.groundColor.set(css('--ground'));
    sun.intensity = 0.62 * k;
    sun.color.set(k < 1 ? '#b9c8ee' : '#fff4e0');
    M.glass.emissive.set(k < 1 ? '#ffc978' : '#000000');
    M.glass.emissiveIntensity = 0.6;
  }

  function mesh(geo, m, cast) {
    var o = new THREE.Mesh(geo, m);
    o.castShadow = cast !== false;
    o.receiveShadow = true;
    return o;
  }
  function box(w, h, d, m, x, y, z, cast) {
    var o = mesh(new THREE.BoxGeometry(w, h, d), m, cast);
    o.position.set(x, y, z);
    return o;
  }
  function V(x, y, z) { return new THREE.Vector3(x, y, z); }

  /* Canvas textures: icons, signs, decals */
  var ICONS = {
    syringe: ['m18 2 4 4', 'm17 7 3-3', 'M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5', 'm9 11 4 4', 'm5 19-3 3', 'm14 4 6 6'],
    pill: ['m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z', 'm8.5 8.5 7 7'],
    steth: ['M11 2v2', 'M5 2v2', 'M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1', 'M8 15a6 6 0 0 0 12 0v-3', 'M22 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0'],
    heart: ['M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z', 'M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27'],
    box: ['M16.5 9.4 7.55 4.24', 'M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z', 'M3.29 7 12 12l8.71-5', 'M12 22V12'],
    shield: ['M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z', 'm9 12 2 2 4-4'],
    phone: ['M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z', 'M12 18h.01'],
    ticket: ['M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z', 'M13 5v2', 'M13 17v2', 'M13 11v2'],
    bed: ['M2 4v16', 'M2 8h18a2 2 0 0 1 2 2v10', 'M2 17h20', 'M6 8v9'],
    star: ['M12 3v18', 'M4.2 7.5l15.6 9', 'M19.8 7.5l-15.6 9']
  };
  function drawIcon(c, name, x, y, size, color, weight) {
    c.save();
    c.translate(x - size / 2, y - size / 2);
    c.scale(size / 24, size / 24);
    c.strokeStyle = color;
    c.lineWidth = weight || 2;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    ICONS[name].forEach(function (d) { c.stroke(new Path2D(d)); });
    c.restore();
  }
  function iconBadge(c, name, x, y, r, color) {
    c.beginPath(); c.arc(x, y, r - 3, 0, Math.PI * 2);
    c.fillStyle = '#ffffff'; c.fill();
    c.lineWidth = 6; c.strokeStyle = color; c.stroke();
    drawIcon(c, name, x, y, r * 1.15, color, 2.2);
  }
  function iconURL(name, color) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    iconBadge(cv.getContext('2d'), name, 32, 32, 32, color);
    return cv.toDataURL();
  }
  function rrect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r);

  }
  var maxAniso = renderer.capabilities.getMaxAnisotropy();
  var canvasTexs = [];
  function canvasTex(cw, ch, draw) {
    var cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    var t = new THREE.CanvasTexture(cv);
    t.anisotropy = maxAniso;
    t.redraw = function () {
      var c = cv.getContext('2d');
      c.clearRect(0, 0, cw, ch);
      draw(c, cw, ch);
      t.needsUpdate = true;
    };
    t.redraw();
    canvasTexs.push(t);
    return t;
  }
  /* A flat sign: o = { text, w, h, x, y, z, ry, rx, bg, fg, icon, round, lit } */
  function sign(parent, o) {
    var ch = 128, cw = Math.round(o.w / o.h * ch);
    var tex = canvasTex(cw, ch, function (c, W, H) {
      if (o.bg) {
        c.fillStyle = o.bg;
        if (o.round) { c.beginPath(); c.arc(W / 2, H / 2, H / 2, 0, Math.PI * 2); c.fill(); }
        else { rrect(c, 0, 0, W, H, 14); c.fill(); }
      }
      var iconW = o.icon ? H * 0.72 : 0, gap = o.icon && o.text ? H * 0.12 : 0;

      c.font = '800 ' + size + 'px "Plus Jakarta Sans", sans-serif';
      var tw = o.text ? c.measureText(o.text).width : 0;

    var blink = Math.sin(clock * 9) > 0;
    sirenA.color.set(blink ? '#ff3b3b' : '#4a1414');
    sirenB.color.set(blink ? '#14224a' : '#3b82ff');

    queues.forEach(function (q) { updateQueue(q, dt); });

    syringe.userData.holder.rotation.y = view.theta;
    syringe.rotation.z = 0.7 + Math.sin(clock * 1.1) * 0.12;
    syringe.userData.holder.position.y = 3.3 + Math.sin(clock * 1.4) * 0.1;
    badges.forEach(function (b) { b.s.position.y = b.y + Math.sin(clock * 1.5 + b.phase) * 0.07; });

    arcs.forEach(function (a, i) {
      a.pulses.forEach(function (p, j) {
        var u = ((clock * 0.12 + i * 0.21 + j * 0.5) % 1);
        if (j % 2) u = 1 - u;
        a.curve.getPoint(u, pv);
        p.position.copy(pv);
      });
    });
  }

  function updateCamera(dt) {
    var k = Math.min(1, dt * 2.2);
    target.lerp(goal, k);
    view.zoom += (zoomGoal - view.zoom) * k;
    placeCamera();
  }

  var wp = new THREE.Vector3();
  var tagLift = {};
  function updateTags() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var placed = [], tipAt = null;
    var blockers = Array.prototype.map.call(topEl.querySelectorAll('h1, .chip, .btn, .speed, .hud'), function (el) { return el.getBoundingClientRect(); });
    Object.keys(tags).forEach(function (id) {
      var b = tags[id];
      var layer = LAYER_OF[id];
      var vis = !layer || layers[layer].visible;
      b.hidden = !vis;
      if (!vis) return;
      var p = ANCHOR[id]();
      wp.set(p.x, DATA[id].by || DATA[id].y, p.z).project(camera);
      if (wp.z > 1) { b.hidden = true; return; }
      var x = (wp.x * 0.5 + 0.5) * w, y = (-wp.y * 0.5 + 0.5) * h;
      if (DATA[id].by) y -= h * badgeSize * camera.projectionMatrix.elements[5] / 4 + 3;
      /* Lift a tag above any tag already placed so names never cover each other */
      var bw = b.offsetWidth + 6, bh = b.offsetHeight + 4, top = y, hit = true, guard = 0;
      x = Math.max(bw / 2, Math.min(w - bw / 2, x));
      while (hit && guard++ < 8) {
        hit = false;
        for (var i = 0; i < placed.length; i++) {
          var o = placed[i];
          if (Math.abs(o.x - x) < (o.w + bw) / 2 && top > o.top - o.h && top - bh < o.top) { top = o.top - o.h; hit = true; }
        }
      }
      placed.push({ x: x, top: top, w: bw, h: bh });
      if (id === selected) tipAt = { x: x, y: top, w: Math.max(bw, DATA[id].by ? h * badgeSize * camera.projectionMatrix.elements[5] / 2 * DATA[id].svc.length : 0) };
      var under = blockers.some(function (r) { return x + bw / 2 > r.left && x - bw / 2 < r.right && top > r.top && top - bh < r.bottom; });
      b.style.visibility = under ? 'hidden' : '';
      tagLift[id] = (tagLift[id] || 0) + ((y - top) - (tagLift[id] || 0)) * 0.15;
      b.style.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - tagLift[id]).toFixed(1) + 'px) translate(-50%,-100%)';
    });
    if (selected) {
      if (!tipAt) { closeTip(); return; }
      /* The tooltip sits beside its name tag and stays clear of the toolbar */
      var tw = tip.offsetWidth, th = tip.offsetHeight, minY = topEl.offsetTop + topEl.offsetHeight + 8;
      var tx = tipAt.x + tipAt.w / 2 + 10;
      if (tx + tw > w - 12) tx = tipAt.x - tipAt.w / 2 - 10 - tw;
      /* Vehicles keep moving, so their tooltip stays in the corner where it is easy to read and close */
      var moving = selected === 'kurir' || selected === 'ojol';
      if (moving) tx = w - tw - 12;
      tx = Math.max(12, Math.min(w - tw - 12, tx));
      if (minY + th > h - 12) minY = 12;
      var ty = moving ? minY : Math.max(minY, Math.min(h - th - 12, tipAt.y - th / 2));
      tip.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px)';
    }
  }

  function frame(now) {
    var real = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(real * speed);
    updateCamera(real);
    renderer.render(scene, camera);
    updateTags();
    requestAnimationFrame(frame);
  }

  /* Light / dark toggle, remembered per browser */
  var root = document.documentElement;
  var themeBtn = document.getElementById('theme');
  var darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() {
    var t = root.getAttribute('data-theme');
    return t ? t === 'dark' : !!(darkQuery && darkQuery.matches);
  }
  function labelTheme() {
    var dark = isDark();
    themeBtn.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Mode terang'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Mode gelap';
  }
  try {
    var savedTheme = localStorage.getItem('ehealth-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') root.setAttribute('data-theme', savedTheme);
  } catch (e) {}
  themeBtn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ehealth-theme', next); } catch (e) {}
  });
  labelTheme();

  applyTheme();
  resize();
  queues.forEach(refreshQueue);
  update(0);
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { canvasTexs.forEach(function (t) { t.redraw(); }); });

  function themeChanged() { labelTheme(); requestAnimationFrame(applyTheme); }
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', themeChanged);
  }
  new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>

</body></html>
